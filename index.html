<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Cuaca Lengkap</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #72a4e4, #5c8fc9);
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background 1s ease;
        }
        
        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .weather-app {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .search-section {
            background: #2c3e50;
            padding: 25px;
            color: white;
        }
        
        .search-container {
            display: flex;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        #city-input {
            flex-grow: 1;
            padding: 18px 25px;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            outline: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        #search-btn, #location-btn {
            padding: 18px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            min-width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        #search-btn:hover, #location-btn:hover {
            background-color: #2980b9;
            transform: scale(1.05);
        }
        
        .weather-content {
            display: flex;
            flex-wrap: wrap;
        }
        
        .current-weather {
            flex: 1;
            min-width: 300px;
            padding: 30px;
            background: linear-gradient(135deg, #4da0b0, #3498db);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .weather-details {
            flex: 2;
            min-width: 400px;
            padding: 30px;
            background: #f8f9fa;
        }
        
        .city-name {
            font-size: 2.2rem;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .date-time {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .weather-icon {
            width: 120px;
            height: 120px;
            margin: 15px 0;
        }
        
        .temperature {
            font-size: 4rem;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .description {
            font-size: 1.8rem;
            text-transform: capitalize;
            margin-bottom: 20px;
        }
        
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .detail-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .detail-icon {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #3498db;
        }
        
        .detail-title {
            font-size: 1rem;
            color: #7f8c8d;
            margin-bottom: 8px;
        }
        
        .detail-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .forecast {
            width: 100%;
            padding: 30px;
            background: white;
        }
        
        .forecast-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            color: #2c3e50;
            text-align: center;
        }
        
.forecast-cards {
    display: flex;
    overflow-x: auto;
    gap: 20px;
    padding-bottom: 15px;
    scroll-snap-type: x mandatory;
}
.forecast-card {
    scroll-snap-align: start;
}

        
        .forecast-day {
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        
        .forecast-icon {
            width: 60px;
            height: 60px;
            margin: 10px auto;
        }
        
        .forecast-temp {
            font-size: 1.5rem;
            font-weight: bold;
            color: #3498db;
            margin: 10px 0;
        }
        
        .forecast-desc {
            font-size: 0.9rem;
            color: #7f8c8d;
            text-transform: capitalize;
        }
        
        #error-message {
            color: #e74c3c;
            margin: 20px 0;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            background: rgba(231, 76, 60, 0.1);
            text-align: center;
        }
        
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1);
        }
        
        .spinner {
            border: 4px solid rgba(52, 152, 219, 0.2);
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .hidden {
            display: none;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            color: white;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        @media (max-width: 768px) {
            .weather-content {
                flex-direction: column;
            }
            
            .search-container {
                flex-direction: column;
            }
            
            #search-btn, #location-btn {
                width: 100%;
                margin-top: 10px;
            }
            
            .details-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-cloud-sun"></i> Aplikasi Cuaca Lengkap</h1>
            <p class="subtitle">Dapatkan informasi cuaca terkini untuk kota mana pun</p>
        </header>
        
        <div class="weather-app">
            <div class="search-section">
                <div class="search-container">
                    <input type="text" id="city-input" placeholder="Masukkan nama kota...">
                    <button id="search-btn" title="Cari Kota"><i class="fas fa-search"></i> Cari</button>
                    <button id="location-btn" title="Gunakan Lokasi Saya"><i class="fas fa-location-arrow"></i></button>
                </div>
            </div>
            
            <div id="weather-info">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Mengambil data cuaca...</p>
                </div>
            </div>

            <div id="error-message" class="hidden"></div>
        </div>
        
        <div class="footer">
            <p>Data cuaca disediakan oleh OpenWeatherMap • © 2023 Aplikasi Cuaca Lengkap</p>
        </div>
    </div>
    
<script>
document.addEventListener('DOMContentLoaded', () => {
    const cityInput = document.getElementById('city-input');
    const searchBtn = document.getElementById('search-btn');
    const locationBtn = document.getElementById('location-btn');
    const weatherInfoDiv = document.getElementById('weather-info');
    const errorMessageDiv = document.getElementById('error-message');
    const loadingDiv = document.querySelector('.loading');

    const apiKey = '9fd7a449d055dba26a982a3220f32aa2';
    const baseUrl = 'https://api.openweathermap.org/data/2.5';

    function showLoading() {
        weatherInfoDiv.innerHTML = '';
        weatherInfoDiv.appendChild(loadingDiv);
        loadingDiv.classList.remove('hidden');
        errorMessageDiv.classList.add('hidden');
    }

    function hideLoading() {
        loadingDiv.classList.add('hidden');
    }

    function getWindDirection(deg) {
        const directions = ["Utara", "Timur Laut", "Timur", "Tenggara", "Selatan", "Barat Daya", "Barat", "Barat Laut"];
        return directions[Math.round(deg / 45) % 8];
    }

    function formatDateTime(timestamp, timezoneOffset) {
        const date = new Date((timestamp + timezoneOffset) * 1000);
        return new Intl.DateTimeFormat("id-ID", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric"
        }).format(date);
    }

    async function getWeatherData(city) {
        showLoading();
        try {
            // Weather saat ini
            const weatherRes = await fetch(
                `${baseUrl}/weather?q=${city}&appid=${apiKey}&units=metric&lang=id`
            );
            if (!weatherRes.ok) throw new Error("Kota tidak ditemukan");
            const weatherData = await weatherRes.json();

            // Forecast 5 hari (3 jam)
            const forecastRes = await fetch(
                `${baseUrl}/forecast?q=${city}&appid=${apiKey}&units=metric&lang=id`
            );
            if (!forecastRes.ok) throw new Error("Data prakiraan tidak tersedia");
            const forecastData = await forecastRes.json();

            displayWeatherData(weatherData, forecastData);
            errorMessageDiv.classList.add('hidden');
        } catch (error) {
            showError(error.message);
        }
    }

    function displayWeatherData(data, forecastData) {
        const { name, main, weather, wind, sys, visibility, dt, timezone } = data;
        const temp = Math.round(main.temp);
        const feelsLike = Math.round(main.feels_like);
        const description = weather[0].description;
        const iconCode = weather[0].icon;
        const humidity = main.humidity;
        const pressure = main.pressure;
        const windSpeed = (wind.speed * 3.6).toFixed(1);
        const country = sys.country;
        const vis = (visibility / 1000).toFixed(1);
        const tempMin = Math.round(main.temp_min);
        const tempMax = Math.round(main.temp_max);
        const windDirection = getWindDirection(wind.deg);

        const dateTime = formatDateTime(dt, timezone);

        // Ambil 5 hari ke depan (1x per hari, jam 12:00 siang)
        const dailyForecast = forecastData.list.filter(item => item.dt_txt.includes("12:00:00")).slice(0, 5);

        weatherInfoDiv.innerHTML = `
            <div class="weather-content">
                <div class="current-weather">
                    <div class="city-name">${name}, ${country}</div>
                    <div class="date-time">${dateTime}</div>
                    <img src="https://openweathermap.org/img/wn/${iconCode}@4x.png" alt="Ikon Cuaca" class="weather-icon">
                    <div class="temperature">${temp}°C</div>
                    <div class="description">${description}</div>
                    <div class="temp-range">Min: ${tempMin}°C / Max: ${tempMax}°C</div>
                </div>
                
                <div class="weather-details">
                    <h2>Detail Cuaca</h2>
                    <div class="details-grid">
                        <div class="detail-card">
                            <div class="detail-icon"><i class="fas fa-temperature-high"></i></div>
                            <div class="detail-title">Terasa Seperti</div>
                            <div class="detail-value">${feelsLike}°C</div>
                        </div>
                        
                        <div class="detail-card">
                            <div class="detail-icon"><i class="fas fa-tint"></i></div>
                            <div class="detail-title">Kelembaban</div>
                            <div class="detail-value">${humidity}%</div>
                        </div>
                        
                        <div class="detail-card">
                            <div class="detail-icon"><i class="fas fa-compress-alt"></i></div>
                            <div class="detail-title">Tekanan</div>
                            <div class="detail-value">${pressure} hPa</div>
                        </div>
                        
                        <div class="detail-card">
                            <div class="detail-icon"><i class="fas fa-wind"></i></div>
                            <div class="detail-title">Angin</div>
                            <div class="detail-value">${windSpeed} km/j • ${windDirection}</div>
                        </div>
                        
                        <div class="detail-card">
                            <div class="detail-icon"><i class="fas fa-eye"></i></div>
                            <div class="detail-title">Visibilitas</div>
                            <div class="detail-value">${vis} km</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="forecast">
                <h3 class="forecast-title">Prakiraan 5 Hari ke Depan</h3>
                <div class="forecast-cards">
                    ${dailyForecast.map(day => `
                        <div class="forecast-card">
                            <div class="forecast-day">${new Intl.DateTimeFormat("id-ID", { weekday: "long" }).format(new Date(day.dt * 1000))}</div>
                            <img src="https://openweathermap.org/img/wn/${day.weather[0].icon}@2x.png" alt="Cuaca" class="forecast-icon">
                            <div class="forecast-temp">${Math.round(day.main.temp)}°C</div>
                            <div class="forecast-desc">${day.weather[0].description}</div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    }

    function showError(message) {
        errorMessageDiv.textContent = message;
        errorMessageDiv.classList.remove('hidden');
        hideLoading();
    }

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                async position => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    showLoading();
                    try {
                        const weatherRes = await fetch(
                            `${baseUrl}/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric&lang=id`
                        );
                        const weatherData = await weatherRes.json();

                        const forecastRes = await fetch(
                            `${baseUrl}/forecast?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric&lang=id`
                        );
                        const forecastData = await forecastRes.json();

                        displayWeatherData(weatherData, forecastData);
                    } catch (error) {
                        showError("Gagal mengambil data lokasi");
                    }
                },
                error => {
                    showError('Izin akses lokasi ditolak. Silakan cari kota secara manual.');
                }
            );
        } else {
            showError('Browser tidak mendukung geolocation.');
        }
    }

    searchBtn.addEventListener('click', () => {
        const city = cityInput.value.trim();
        if (city) {
            getWeatherData(city);
        } else {
            showError('Mohon masukkan nama kota.');
        }
    });

    locationBtn.addEventListener('click', getLocation);

    cityInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            const city = cityInput.value.trim();
            if (city) {
                getWeatherData(city);
            } else {
                showError('Mohon masukkan nama kota.');
            }
        }
    });

    // default load Jakarta
    getWeatherData('Jakarta');
});
</script>

</body>
</html>
