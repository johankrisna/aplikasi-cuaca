<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-cloud-sun"></i>Weather App</h1>
            <p class="subtitle">Get accurate weather forecasts for any location worldwide</p>
        </header>
        
        <div class="weather-app">
            <div class="search-section">
                <div class="search-container">
                    <div class="search-input-container">
                        <input type="text" id="city-input" placeholder="Search for a city..." autocomplete="off">
                        <div id="city-suggestions" class="suggestions-dropdown hidden"></div>
                    </div>
                    <button id="search-btn" title="Search City">
                        <i class="fas fa-search"></i>
                        <span id="search-btn-text">Search</span>
                    </button>
                    <button id="location-btn" title="Use My Location">
                        <i class="fas fa-location-arrow"></i>
                    </button>
                </div>
                
                <!-- Popular Cities Section -->
                <div class="popular-cities">
                    <div class="popular-cities-title">Popular Cities:</div>
                    <div class="city-tags">
                        <button class="city-tag" data-city="Jakarta">Jakarta</button>
                        <button class="city-tag" data-city="Tokyo">Tokyo</button>
                        <button class="city-tag" data-city="London">London</button>
                        <button class="city-tag" data-city="New York">New York</button>
                        <button class="city-tag" data-city="Paris">Paris</button>
                        <button class="city-tag" data-city="Singapore">Singapore</button>
                        <button class="city-tag" data-city="Sydney">Sydney</button>
                        <button class="city-tag" data-city="Dubai">Dubai</button>
                    </div>
                </div>
            </div>
            
            <div id="weather-info">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading weather data...</p>
                </div>
            </div>

            <div id="error-message" class="hidden"></div>
        </div>
        
        <div class="footer">
            <p>Weather data provided by OpenWeatherMap</p>
        </div>
    </div>
    
    <!-- City Data for Autocomplete -->
    <script src="cities.js"></script>
    <script src="script.js"></script>
</body>
</html>
